<meta charset="utf-8">
<title>V4V Music Manager Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: toolbar over sidebar - content - inspector; medium = overlay sidebar; compact (<600px) = nav bar + tab bar.
   Tokens follow journeys/wireframes/00-foundations.md sec.5-sec.7. "Structure" skin = neutral; "MusicIndex" skin = musicindex.org ideas. */
:root{
  --font-text:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg-window:#f4f4f6; --bg-sidebar:#ececf0; --bg-content:#ffffff; --bg-elevated:#ffffff;
  --bg-hover:rgba(60,60,72,.06); --bg-selected:rgba(60,60,72,.11);
  --fg-primary:#1c1c21; --fg-secondary:#5c5c66; --fg-tertiary:#8b8b95; --fg-on-accent:#ffffff;
  --accent:#0a63d8; --accent-subtle:rgba(10,99,216,.12); --focus-ring:#0a63d8;
  --separator:rgba(60,60,67,.16); --border-control:rgba(60,60,67,.26);
  --state-ok:#1d7f46; --state-warn:#a95700; --state-danger:#c4271b; --state-live:#d70015; --state-info:#0a63d8;
  --entity-release:#8b8b95; --entity-track:#8b8b95; --entity-artist:#8b8b95; --entity-playlist:#8b8b95;
  --art-sat:0; --art-l:85%; --art-ink:#6f6f78; --shadow-art:none;
  --material-bar:rgba(244,244,246,.86); --scrim:rgba(20,20,24,.32);
  --radius-control:7px; --radius-row:8px; --radius-art-sm:6px; --radius-art-lg:8px; --radius-sheet:14px;
  --t-lt:700 2.125rem/1.12 var(--font-display); --t-t1:700 1.75rem/1.15 var(--font-display);
  --t-t2:700 1.375rem/1.2 var(--font-display); --t-t3:600 1.25rem/1.25 var(--font-text);
  --t-hl:600 1.0625rem/1.3 var(--font-text); --t-bd:400 1.0625rem/1.35 var(--font-text);
  --t-co:400 1rem/1.42 var(--font-text); --t-sh:400 .9375rem/1.3 var(--font-text);
  --t-fn:400 .8125rem/1.3 var(--font-text); --t-c1:500 .75rem/1.25 var(--font-text); --t-c2:500 .6875rem/1.2 var(--font-text);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-window:#1a1a1d; --bg-sidebar:#222226; --bg-content:#141416; --bg-elevated:#26262b;
  --bg-hover:rgba(255,255,255,.06); --bg-selected:rgba(255,255,255,.11);
  --fg-primary:#f2f2f5; --fg-secondary:#a6a6b0; --fg-tertiary:#777780; --fg-on-accent:#ffffff;
  --accent:#4c93ff; --accent-subtle:rgba(76,147,255,.18); --focus-ring:#4c93ff;
  --separator:rgba(255,255,255,.10); --border-control:rgba(255,255,255,.2);
  --state-ok:#3fcf7d; --state-warn:#ffb340; --state-danger:#ff6259; --state-live:#ff453a; --state-info:#4c93ff;
  --entity-release:#8b8b95; --entity-track:#8b8b95; --entity-artist:#8b8b95; --entity-playlist:#8b8b95;
  --art-l:24%; --art-ink:#9d9da6; --material-bar:rgba(26,26,29,.86); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg-window:#1a1a1d; --bg-sidebar:#222226; --bg-content:#141416; --bg-elevated:#26262b;
  --bg-hover:rgba(255,255,255,.06); --bg-selected:rgba(255,255,255,.11);
  --fg-primary:#f2f2f5; --fg-secondary:#a6a6b0; --fg-tertiary:#777780; --fg-on-accent:#ffffff;
  --accent:#4c93ff; --accent-subtle:rgba(76,147,255,.18); --focus-ring:#4c93ff;
  --separator:rgba(255,255,255,.10); --border-control:rgba(255,255,255,.2);
  --state-ok:#3fcf7d; --state-warn:#ffb340; --state-danger:#ff6259; --state-live:#ff453a; --state-info:#4c93ff;
  --entity-release:#8b8b95; --entity-track:#8b8b95; --entity-artist:#8b8b95; --entity-playlist:#8b8b95;
  --art-l:24%; --art-ink:#9d9da6; --material-bar:rgba(26,26,29,.86); --scrim:rgba(0,0,0,.55); color-scheme:dark}
/* MusicIndex skin: one blue accent, entity hues, coloured art with shadow, pills, Figtree off Apple devices */
:root[data-skin="mi"]{
  --font-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Figtree",system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Figtree",system-ui,sans-serif;
  --bg-window:#ffffff; --bg-sidebar:#f5f5f7; --bg-content:#ffffff; --bg-elevated:#ffffff;
  --accent:#0a5bd6; --accent-subtle:rgba(10,91,214,.12); --focus-ring:#005bd3;
  --entity-release:#8a5e21; --entity-track:#008e9c; --entity-artist:#723763; --entity-playlist:#006238;
  --art-sat:40; --art-l:44%; --art-ink:rgba(255,255,255,.9); --shadow-art:0 12px 28px rgba(0,0,0,.18);
  --material-bar:rgba(255,255,255,.72); --radius-control:999px; --radius-art-sm:10px; --radius-art-lg:12px;
  --t-lt:800 2.125rem/1.1 var(--font-display); --t-t1:800 1.75rem/1.12 var(--font-display);
}
@media (prefers-color-scheme:dark){:root[data-skin="mi"]:not([data-theme="light"]){
  --bg-window:#0b0b0d; --bg-sidebar:#141417; --bg-content:#0b0b0d; --bg-elevated:#1c1c1f;
  --accent:#2d7bff; --accent-subtle:rgba(45,123,255,.2); --focus-ring:#2d7bff;
  --entity-release:#c4965b; --entity-track:#00a3b3; --entity-artist:#fab5e5; --entity-playlist:#8edfad;
  --art-sat:40; --art-l:38%; --art-ink:rgba(255,255,255,.9); --shadow-art:0 12px 28px rgba(0,0,0,.5);
  --material-bar:rgba(11,11,13,.62)}}
:root[data-skin="mi"][data-theme="dark"]{
  --bg-window:#0b0b0d; --bg-sidebar:#141417; --bg-content:#0b0b0d; --bg-elevated:#1c1c1f;
  --accent:#2d7bff; --accent-subtle:rgba(45,123,255,.2); --focus-ring:#2d7bff;
  --entity-release:#c4965b; --entity-track:#00a3b3; --entity-artist:#fab5e5; --entity-playlist:#8edfad;
  --art-sat:40; --art-l:38%; --art-ink:rgba(255,255,255,.9); --shadow-art:0 12px 28px rgba(0,0,0,.5);
  --material-bar:rgba(11,11,13,.62)}

*{box-sizing:border-box}
html,body{height:100%}
html{font-size:calc(16px * var(--ts,1))}
@media (min-width:1000px){html{font-size:calc(14px * var(--ts,1))}}
body{background:var(--bg-window);color:var(--fg-primary);font:var(--t-bd);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
h1,h2,h3,p{margin:0}
.lt{font:var(--t-lt);letter-spacing:-.02em;text-wrap:balance}.t1{font:var(--t-t1);letter-spacing:-.015em;text-wrap:balance}
.t2{font:var(--t-t2);letter-spacing:-.01em}.t3{font:var(--t-t3)}.hl{font:var(--t-hl)}.co{font:var(--t-co)}
.sh{font:var(--t-sh)}.fn{font:var(--t-fn)}.c1{font:var(--t-c1)}.c2{font:var(--t-c2)}
.muted{color:var(--fg-secondary)}.faint{color:var(--fg-tertiary)}.num{font-variant-numeric:tabular-nums}
.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}

/* shell */
#app{display:grid;height:100%;grid-template-columns:var(--sidebar-w,248px) minmax(0,1fr) auto;grid-template-rows:52px minmax(0,1fr) auto auto;
  grid-template-areas:"tool tool tool" "side main insp" "acc acc acc" "tabs tabs tabs"}
.toolbar{grid-area:tool;display:flex;align-items:center;gap:6px;padding:0 16px;background:var(--material-bar);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--separator);min-width:0;z-index:30}
.tb-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.tb-search{position:relative;display:flex;align-items:center;gap:6px;width:min(340px,38vw);height:32px;padding:0 10px;border-radius:9px;background:var(--bg-selected);color:var(--fg-secondary)}
.tb-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:var(--t-sh);color:var(--fg-primary)}
.tb-search:focus-within{outline:2px solid var(--focus-ring)}
kbd{font:var(--t-c1);color:var(--fg-tertiary);border:1px solid var(--separator);border-radius:5px;padding:1px 5px;white-space:nowrap}
.navbar{grid-area:nav;display:none;align-items:center;gap:6px;min-height:44px;padding:4px max(12px,env(safe-area-inset-left,0px));background:var(--material-bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--separator)}
.sidebar{grid-area:side;background:var(--bg-sidebar);border-right:1px solid var(--separator);overflow:auto;padding:8px 8px 24px;display:flex;flex-direction:column}
.main{grid-area:main;overflow:auto;background:var(--bg-content);position:relative;outline:none}
.inspector{grid-area:insp;width:320px;border-left:1px solid var(--separator);background:var(--bg-sidebar);overflow:auto;padding:20px}
.accessory{grid-area:acc;display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--separator);background:var(--material-bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);min-width:0}
.tabbar{grid-area:tabs;display:none;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--separator);background:var(--material-bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sidescrim{position:fixed;inset:52px 0 0 0;background:var(--scrim);z-index:39}
.compact-only{display:none!important}
@media (max-width:999px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"tool" "main" "acc" "tabs"}
  .sidebar{position:fixed;top:52px;bottom:0;left:0;width:280px;z-index:40;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .sidebar.open{transform:none}
  .inspector{display:none!important}
  .wide-only{display:none!important}
}
@media (max-width:599px){
  #app{grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"nav" "main" "acc" "tabs"}
  .toolbar{display:none}.navbar{display:flex}.tabbar{display:grid}.sidebar{display:none}
  .compact-only{display:flex!important}.not-compact{display:none!important}
}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--fg-secondary);cursor:pointer;position:relative;flex:none}
.iconbtn:hover{background:var(--bg-hover);color:var(--fg-primary)}
.iconbtn:disabled{opacity:.35;cursor:default;background:transparent}
.iconbtn[aria-pressed="true"]{color:var(--accent)}
@media (pointer:coarse){.iconbtn{width:44px;height:44px}}
.iconbtn .pip{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;padding:0 4px;background:var(--accent);color:var(--fg-on-accent);font:var(--t-c2);display:grid;place-items:center}

/* sidebar */
.side-h{font:var(--t-sh);font-weight:600;color:var(--fg-secondary);padding:14px 10px 4px}
.side-i{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:5px 10px;border:0;border-radius:7px;background:transparent;font:var(--t-bd);text-align:left;cursor:pointer;color:var(--fg-primary)}
.side-i:hover{background:var(--bg-hover)}
.side-i[aria-current="page"]{background:var(--bg-selected);font-weight:600}
.side-i .ic{color:var(--accent)}
.side-i .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-i.drop-target{outline:2px solid var(--accent);background:var(--accent-subtle)}
.side-sep{border-top:1px solid var(--separator);margin:10px 8px}
.side-foot{margin-top:auto;padding:16px 10px 0;font:var(--t-fn);color:var(--fg-tertiary)}
.side-new{display:flex;flex-direction:column;gap:6px;padding:6px 10px}
.side-new input[type=text]{width:100%;padding:6px 8px;border:1px solid var(--focus-ring);border-radius:6px;background:var(--bg-content)}
.side-new label{font:var(--t-fn);color:var(--fg-secondary);display:flex;gap:6px;align-items:center}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font:var(--t-c1);background:var(--bg-selected);color:var(--fg-secondary)}
.count.hot{background:var(--accent);color:var(--fg-on-accent)}

/* page */
.page{max-width:1180px;margin:0 auto;padding:24px clamp(16px,3vw,32px) 120px;display:flex;flex-direction:column;gap:28px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h .sub{margin-top:4px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accent);font:var(--t-hl);cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 20px}
@media (max-width:599px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px}
.shelf>*{scroll-snap-align:start}
.chips{gap:6px;flex-wrap:wrap}

/* art */
.art{position:relative;aspect-ratio:1;width:100%;max-width:100%;border-radius:var(--radius-art-sm);background:hsl(var(--h,220) calc(var(--art-sat) * 1%) var(--art-l));color:var(--art-ink);display:grid;place-items:center;box-shadow:var(--shadow-art);overflow:hidden}
.art .mono{font:700 1.35rem/1 var(--font-display);letter-spacing:.05em}
.art.sm{width:44px;height:44px;box-shadow:none;flex:none}.art.sm .mono{font-size:.8rem}
.art.xs{width:32px;height:32px;box-shadow:none;flex:none;border-radius:5px}.art.xs .mono{font-size:.65rem}
.art.hdr{width:220px;border-radius:var(--radius-art-lg)}.art.hdr .mono{font-size:3rem}
.art.round{border-radius:50%}
.mosaic{display:grid;grid-template-columns:1fr 1fr;place-items:stretch;background:var(--bg-selected)}
.mosaic i{display:block;background:hsl(var(--h) calc(var(--art-sat) * 1%) var(--art-l));border:1px solid var(--bg-content)}
@media (max-width:599px){.art.hdr{width:min(60vw,260px)}}

/* tiles */
.tile{display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0;border-radius:var(--radius-art-sm);position:relative}
.tile .t-title{font:var(--t-bd);font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .t-sub{font:var(--t-c1);color:var(--fg-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t-act{position:absolute;right:8px;bottom:8px}
.tile .t-check{position:absolute;left:8px;top:8px}
.tile.sel .art{outline:3px solid var(--accent);outline-offset:2px}
.fab{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:0;background:var(--bg-elevated);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.fab.done{color:var(--state-ok)}.fab.warn{color:var(--state-warn)}
.newtag{position:absolute;left:8px;top:8px;font:var(--t-c2);font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--bg-elevated);color:var(--fg-primary)}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:56px;padding:6px 8px;border-radius:var(--radius-row);cursor:default;position:relative}
.row+.row{box-shadow:0 -1px 0 var(--separator)}
.row:hover{background:var(--bg-hover);box-shadow:none}
.row:hover+.row{box-shadow:none}
.row.clickable{cursor:pointer}
.row.sel{background:var(--accent-subtle)}
.row.hi{background:var(--accent-subtle)}
.row .r-main{min-width:0}
.row .r-title{font:var(--t-bd)}
.row .r-sub{font:var(--t-sh);color:var(--fg-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-trail{display:flex;align-items:center;gap:8px}
.row .more{opacity:0}
.row:hover .more,.row:focus-within .more,.row:focus .more{opacity:1}
@media (hover:none){.row .more{opacity:1}}
.row.track{grid-template-columns:2.2em minmax(0,1fr) auto auto}
.row.track .r-num{font:var(--t-sh);color:var(--fg-tertiary);text-align:right;font-variant-numeric:tabular-nums}
.row .dur{font:var(--t-sh);color:var(--fg-secondary);font-variant-numeric:tabular-nums;min-width:3em;text-align:right}
.row.pl{grid-template-columns:auto 2em minmax(0,1fr) auto auto}
.handle{cursor:grab;color:var(--fg-tertiary);display:grid;place-items:center;width:24px}
.row.dragging{opacity:.4}
.row.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.indent{padding-left:40px}
.colhead{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto auto;gap:12px;padding:0 8px 6px;font:var(--t-fn);color:var(--fg-tertiary);border-bottom:1px solid var(--separator)}
.cbx{width:20px;height:20px;accent-color:var(--accent);margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 14px;border-radius:var(--radius-control);border:1px solid var(--border-control);background:var(--bg-elevated);font:var(--t-hl);cursor:pointer;white-space:nowrap;color:var(--fg-primary)}
.btn:hover{background:var(--bg-hover)}
.btn.primary{background:var(--accent);color:var(--fg-on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.live{background:var(--state-live);color:var(--fg-on-accent);border-color:transparent}
.btn.live:hover{filter:brightness(1.07);background:var(--state-live)}
.btn.danger{color:var(--state-danger)}
.btn.danger.primary{background:var(--state-danger);color:var(--fg-on-accent)}
.btn.plain{border-color:transparent;background:transparent;color:var(--accent)}
.btn.plain:hover{background:var(--accent-subtle)}
.btn.sm{min-height:28px;padding:0 10px;font:var(--t-sh);font-weight:600}
.btn.sm.warn{color:var(--state-warn)}
.btn[disabled]{opacity:.5;cursor:default}
@media (pointer:coarse){.btn{min-height:44px}.btn.sm{min-height:36px}}
.btn.wide{width:100%}
.badge{display:inline-flex;align-items:center;gap:4px;font:var(--t-c1);color:var(--fg-secondary);white-space:nowrap}
.badge.ok{color:var(--state-ok)}.badge.warn{color:var(--state-warn)}.badge.danger{color:var(--state-danger)}
.livebadge{display:inline-flex;align-items:center;gap:6px;color:var(--state-live);font:var(--t-c1);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.livebadge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ring{--p:0;width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p) * 1%),var(--bg-selected) 0);display:inline-grid;place-items:center;flex:none}
.ring::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--bg-elevated)}
.seg{display:inline-flex;background:var(--bg-selected);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font:var(--t-sh);font-weight:600;color:var(--fg-secondary);cursor:pointer;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--bg-elevated);color:var(--fg-primary);box-shadow:0 1px 3px rgba(0,0,0,.14)}
@media (pointer:coarse){.seg button{min-height:38px}}

/* header (C4) */
.hdr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:end}
.hdr .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:7px;font:var(--t-c1);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-secondary)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--e,var(--entity-release));flex:none}
.dot.hollow{background:transparent;box-shadow:inset 0 0 0 1.5px var(--e,var(--entity-artist))}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.desc{max-width:65ch;color:var(--fg-secondary);font:var(--t-co)}
.name-link{border:0;background:none;padding:0;font:var(--t-hl);color:var(--accent);cursor:pointer;text-align:left}

function movePal(d) { const n = S.palItems.length; if (!n) return; S.pal.idx = (S.pal.idx + d + n) % n; markPal(); $('#pal-' + S.pal.idx)?.scrollIntoView({block: 'nearest'}); }
function runPal(i) { const it = S.palItems[i]; closePalette(true); if (it) it.run(); }
function closePalette(ran) { const ret = S.pal && S.pal.ret; $('#palette').innerHTML = ''; if (!ran && ret && ret.focus) ret.focus(); }

/* ---------- action handlers ---------- */
function openMenuAt(items, el, ev) {
  let x, y;
  if (ev && ev.type === 'contextmenu') { x = ev.clientX; y = ev.clientY; }
  else { const rc = el.getBoundingClientRect(); x = rc.left; y = rc.bottom + 4; }
  S.menu = {items, x, y}; S.pop = null; renderOverlay();
  setTimeout(() => $('#menu button')?.focus(), 10);
}
const ACT = {
  nav: (a, b) => nav(a, b), back: goBack, fwd: goFwd, palette: () => openPalette(),
  tab: a => { S.tab = a; nav(a === 'library' ? 'lib' : a, a === 'library' ? 'releases' : undefined); if (a === 'search') setTimeout(() => $('#q2')?.focus(), 30); },
  navLib: a => nav('lib', a), navPlaylists: () => nav('playlists'),
  toggleSidebar: () => { if (isWide()) { const app = $('#app'); app.style.setProperty('--sidebar-w', app.style.getPropertyValue('--sidebar-w') === '0px' ? '248px' : '0px'); $('#sidebar').style.display = app.style.getPropertyValue('--sidebar-w') === '0px' ? 'none' : ''; } else { S.sidebarOpen = !S.sidebarOpen; renderChrome(); } },
  toggleInspector: () => { S.inspector = !S.inspector; renderChrome(); renderInspector(); },
  getRel: a => getTracks(R(a).tracks.map(t => t.id)),
  openRel: a => nav('release', a),
  getTrack: a => getTracks([a]), cancelTrack: a => cancelTrack(a), fixTrack: a => fixTrack(a),
  getArtist: a => getTracks(REL.filter(r => r.artist === a).flatMap(missingOf).map(t => t.id)),
  getSingles: a => getTracks(REL.filter(r => r.artist === a && r.kind === 'Single').flatMap(missingOf).map(t => t.id)),
  addShow: a => { const sp = showPl(); if (sp) addToPlaylist(sp.id, a); },
  menu: (a, b, el, ev) => openMenuAt(itemMenu(a), el, ev),
  menuAdd: (a, b, el) => openMenuAt(playlistItems(a), el),
  menuPick: a => { const it = S.menu.items[+a]; if (it.sub) { S.menu.items = [{label: 'Back', icon: 'chevl', run: null, back: S.menu.items}, '-', ...it.sub]; renderOverlay(); setTimeout(() => $('#menu button')?.focus(), 10); return; } if (it.back) { S.menu.items = it.back; renderOverlay(); return; } S.menu = null; renderOverlay(); it.run && it.run(); },
  moreMenu: (a, b, el) => openMenuAt([{label: 'Commands', icon: 'search', run: () => openPalette()}, {label: 'Settings', icon: 'gear', run: () => nav('settings', 'general')}, {label: 'Activity', icon: 'download', run: () => ACT.activity()}, {label: 'Dropped Releases', icon: 'disc', run: () => { S.libFilter = 'dropped'; nav('lib', 'releases'); }}], el),
  selMode: a => enterSelection(a), selDone: () => exitSelection(),
  selGet: () => { getTracks(refTracks('sel')); exitSelection(); },
  selAdd: (a, b, el) => openMenuAt(playlistItems('sel'), el),
  selDrop: () => dropRefs(refTracks('sel'), plural(S.sel.ids.size, S.sel.kind)),
  libFilter: a => { S.libFilter = a; exitSelection(true); render(); },
  toggleGroup: a => { S.expanded.has(a) ? S.expanded.delete(a) : S.expanded.add(a); render(); },
  seg: a => { S.searchSeg = a; exitSelection(true); render(); },
  saveSearch: () => toast(`Saved \u201c${S.q}\u201d. It's in Discover now.`),
  searchGo: () => { S.pop = null; S.searchSeg = 'top'; renderOverlay(); nav('search'); },
  openSugg: a => { S.pop = null; renderOverlay(); openRef(a); },
  cmd: a => { S.pop = null; renderOverlay(); $('#q').blur(); COMMANDS[+a].run(); },
  focusSearch: () => { if (isCompact()) ACT.tab('search'); else $('#q').focus(); },
  loadMore: () => toast("Prototype: this part isn't built. The wireframes describe it."),
  noop: () => {},
  newPl: () => newPlaylist(), npCreate: () => createPlaylist($('#np-name').value, $('#np-pin').checked, S.sheet.ref),
  playPl: a => { playFrom(a); if (S.route.n !== 'show' && !isCompact()) toast(`Playing ${PL(a).name}. Controls are at the bottom and on Show.`); },
  playPlSheet: () => { S.sheet = null; playFrom(S.showPl); nav('show'); },
  playAgain: () => { S.show.played = []; playFrom(S.play.plId); },
  playPause: () => { if (!S.play.tid) return; if (!S.play.paused && S.show.stage === 'live') { S.sheet = {kind: 'pauselive'}; renderOverlay(); return; } S.play.paused = !S.play.paused; if (S.play.finished) { S.play.finished = false; } render(); },
  pauseConfirm: () => { S.sheet = null; S.play.paused = true; render(); },
  prev: () => skip(-1), next: () => skip(1), stop: () => { stopPlayback(); toast('Stopped. The show is back at Prepare.'); },
  check: () => openCheck(), checkFix: a => { const r = checkRows()[+a]; r.run(); if (S.sheet && S.sheet.kind === 'check') renderOverlay(); },
  goLive: () => openGoLive(), goLiveConfirm: () => { S.show.recOpt = $('#rec-opt').checked; startGoingLive(); },
  cancelGoing: () => { S.show.stage = 'check'; S.show.steps = null; render(); toast('Stopped before going on air. Nothing is on air.'); },
  copyTag: () => copyText('<podcast:liveValue uri="https://api.musicindex.org/v1/liveitems/ep42-7f3a" protocol="socket.io"/>', 'Copied the live tag.'),
  checkFeed: () => { S.setup.feed = $('#feedurl').value; const st = S.show.steps, i = st.findIndex(s => s.needsUser); st[i].s = 'ok'; st[i].at = new Date().toLocaleTimeString(); S.show.feedTagDone = true; toast('Found the live tag in your feed.'); runStep(i + 1); },
  endShow: () => { S.sheet = {kind: 'endshow'}; renderOverlay(); setTimeout(() => $('#sheet-ok')?.focus(), 30); },
  endConfirm: () => { S.show.stopServices = $('#stop-svc').checked; S.sheet = null; S.show.ended = Date.now(); S.show.stage = 'wrap'; stopPlayback(); toast('Off air. The stream is disconnected.'); },
  wrapUp: () => { S.show.liveStart = S.show.liveStart || Date.now() - S.show.played.length * 200000; S.show.ended = Date.now(); S.show.stage = 'wrap'; stopPlayback(); },
  wrapDone: () => { Object.assign(S.show, {stage: 'prepare', checked: false, played: [], steps: null, rec: false, issues: []}); render(); },
  copyPath: () => copyText('~/Recordings/episode-42.mp3', 'Copied the path.'),
  simFail: () => { S.show.health.publisher = 'fail'; render(); toast('Publisher stopped sending. Its row shows the fix.', null, true); },
  restartPub: () => { S.sheet = null; restartPublisher(); }, logs: () => { S.sheet = {kind: 'logs'}; renderOverlay(); },
  copyReport: () => copyText('Publisher report (sample)', 'Copied the report.'),
  chooseMode: a => { S.show.mode = a; S.setup.modeChosen = true; S.show.checked = false; if (a === 'mixxx' && S.play.tid) stopPlayback(); render(); },
  changePl: (a, b, el) => openMenuAt(S.playlists.map(p => ({label: p.name, icon: p.id === S.showPl ? 'star' : 'list', run: () => { S.showPl = p.id; S.show.checked = false; render(); }})), el),
  wrapNoop: () => {},
  inboxOpen: a => S._inbox[+a].open(), inboxRun: a => S._inbox[+a].run(),
  checkNow: () => { S.log.unshift({t: clock(), text: 'Checked 24 feeds \u2014 nothing new'}); render(); toast('Checked 24 feeds. Nothing new since 14:02.'); },
  fixAllRoutes: () => fixRoutes(Object.values(TR).filter(t => t.issue === 'route').map(t => t.id)),
  keepTrack: a => { T(a).issue = null; render(); toast(`Keeping \u201c${T(a).title}\u201d.`); },
  rmFromAll: a => { const prev = S.playlists.map(p => [p, [...p.tracks]]); S.playlists.forEach(p => p.tracks = p.tracks.filter(x => x !== a)); T(a).issue = null; render(); toast(`Removed \u201c${T(a).title}\u201d from every playlist.`, {label: 'Undo', run: () => { prev.forEach(([p, t]) => p.tracks = t); T(a).issue = 'removed'; render(); }}); },
  dropTrack: a => { T(a).issue = null; dropRefs([a], `\u201c${T(a).title}\u201d`); },
  applyAll: () => confirmSheet({title: 'Apply Updates from 3 Releases?', body: '<p class="co">Gets 1 new track and rewrites tags in 9 files. Files playing on air right now are skipped.</p>', ok: 'Apply Updates', run: () => { S.updatesApplied = true; const r = R('discoswag'); const t = {id: 'discoswag-7', rid: 'discoswag', n: 7, title: 'Encore (Live)', dur: 245, state: 'none', progress: 0, issue: null}; TR[t.id] = t; r.tracks.push(t); S.log.unshift({t: clock(), text: 'Updated 3 releases, wrote 9 files'}); getTracks([t.id]); toast('Updated 3 releases and wrote 9 files. Getting 1 new track.'); }}),
  setTheme: a => { if (a === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = a; store('theme', a); render(); },
  setTs: a => { document.documentElement.style.setProperty('--ts', a); store('ts', +a); render(); },
  setSkin: a => { if (a === 'mi') document.documentElement.dataset.skin = 'mi'; else delete document.documentElement.dataset.skin; store('skin', a); render(); },
  setupToggle: a => { S.setupOpen = S.setupOpen === a ? null : a; render(); },
  testIt: a => { const el = $('#test-' + a); if (el) { el.textContent = 'Testing\u2026'; setTimeout(() => { el.innerHTML = a === 'mi' ? `${ic('checkc')} Reached api.musicindex.org in 84 ms` : `${ic('checkc')} butt 1.42 answered \u00b7 not connected`; el.style.color = 'var(--state-ok)'; }, 700); } },
  saveEncoder: () => { S.setup.encoder = true; S.setupOpen = null; S.show.checked = false; render(); toast('Stream encoder set up.'); },
  saveFeed: () => { S.setup.feed = $('#feed-in').value.trim(); S.setupOpen = null; render(); toast('Saved your show\u2019s feed.'); },
  backup: () => toast('Backed up the database to ~/.local/share/v4vmm/backups (sample).'),
  showWelcome: () => { S.welcome = true; S.welcomeStep = 0; renderOverlay(); runWelcome(); },
  welcomeDone: () => { S.welcome = false; store('welcomed', true); renderOverlay(); toast('Tip: press Get on any release to take it. Press ' + K('\u2318K') + ' or / for every action.'); },
  activity: () => { S.pop = S.pop === 'activity' ? null : 'activity'; renderOverlay(); },
  stopAll: () => { DL.queue.forEach(id => T(id).state = 'none'); DL.total -= DL.queue.length; DL.queue = []; render(); toast('Stopped the queued downloads. The ones already running will finish.'); },
  sheetCancel: () => { S.sheet = null; renderOverlay(); },
  sheetBg: (a, b, el, ev) => { if (ev.target === el) { S.sheet = null; renderOverlay(); } },
  sheetOk: () => { const s = S.sheet; S.sheet = null; renderOverlay(); s.run(); },
};
function runWelcome() { const step = () => { if (!S.welcome) return; S.welcomeStep++; renderOverlay(); if (S.welcomeStep < 4) setTimeout(step, 450); else setTimeout(() => $('#wl-go')?.focus(), 30); }; setTimeout(step, 500); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const actEl = e.target.closest('[data-act]');
  const inMenu = e.target.closest('#menu, .popover, .tb-search');
  if (!inMenu && (S.menu || S.pop) && !(actEl && ['menu', 'menuAdd', 'selAdd', 'changePl', 'moreMenu', 'activity'].includes(actEl.dataset.act))) { S.menu = null; S.pop = null; renderOverlay(); if (!actEl) return; }
  if (actEl) {
    const fn = ACT[actEl.dataset.act];
    if (actEl.dataset.act === 'sheetBg' && e.target !== actEl) { const inner = e.target.closest('[data-act]'); if (inner === actEl) return; }
    if (fn) { e.preventDefault(); fn(actEl.dataset.a, actEl.dataset.b, actEl, e); }
    return;
  }
  const selEl = e.target.closest('[data-sel]');
  if (selEl && (S.sel.on || e.metaKey || e.ctrlKey || e.shiftKey)) { const [k, id] = selEl.dataset.sel.split(':'); if (S.sel.on && S.sel.kind !== k && !(e.metaKey || e.ctrlKey)) return; toggleSel(k, id); return; }
  const openEl = e.target.closest('[data-open]');
  if (openEl) openRef(openEl.dataset.open);
});
document.addEventListener('dblclick', e => { const el = e.target.closest('[data-dblplay]'); if (el && !S.sel.on) { const [p, t] = el.dataset.dblplay.split(':'); if (T(t).state === 'library') playFrom(p, t); } });
document.addEventListener('contextmenu', e => { const el = e.target.closest('[data-menu]'); if (el) { e.preventDefault(); openMenuAt(itemMenu(el.dataset.menu), el, e); } });
document.addEventListener('input', e => {
  if (e.target.id === 'q2') { S.q = e.target.value; S.searchSeg = 'top'; $('#sres').innerHTML = searchResultsHTML(); }
  if (e.target.id === 'pl-note') PL(e.target.dataset.pl).note = e.target.value;
  if (e.target.id === 'scrub') { S.play.pos = +e.target.value; }
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName) && !['checkbox', 'range'].includes(document.activeElement.type);
  const mod = e.metaKey || e.ctrlKey;
  if (e.target.id === 'side-np') { if (e.key === 'Enter') createPlaylist(e.target.value, $('#side-np-pin').checked, S.newPl.ref); if (e.key === 'Escape') { S.newPl = false; render(); } return; }
  if (e.target.id === 'np-name' && e.key === 'Enter') { ACT.npCreate(); return; }
  if (e.target.id === 'rename') { if (e.key === 'Enter') { const v = e.target.value.trim(); if (v) PL(S.renaming).name = v; S.renaming = null; render(); } if (e.key === 'Escape') { S.renaming = null; render(); } return; }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (mod && e.key.toLowerCase() === 'n' && !e.shiftKey) { e.preventDefault(); newPlaylist(); return; }
  if (mod && e.key === ',') { e.preventDefault(); nav('settings', 'general'); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'c') { e.preventDefault(); openCheck(); return; }
  if (mod && e.altKey && (e.key.toLowerCase() === 'i' || e.code === 'KeyI')) { e.preventDefault(); ACT.toggleInspector(); return; }
  if (mod && e.key === 'ArrowRight' && S.play.tid) { e.preventDefault(); skip(1); return; }
  if (mod && e.key === 'ArrowLeft' && S.play.tid) { e.preventDefault(); skip(-1); return; }
  if (mod && e.key === '.' && S.play.tid && S.show.stage !== 'live') { e.preventDefault(); stopPlayback(); return; }
  if (e.key === 'Escape') {
    if ($('#palette').innerHTML) { closePalette(); return; }
    if (S.menu || S.pop) { S.menu = null; S.pop = null; renderOverlay(); return; }
    if (S.sheet) { S.sheet = null; renderOverlay(); return; }
    if (S.sel.on) { exitSelection(); return; }
    if (S.sidebarOpen) { S.sidebarOpen = false; renderChrome(); return; }
    if (S.newPl) { S.newPl = false; render(); return; }
  }
  if (typing) return;
  if (e.key === '/' && !mod) { e.preventDefault(); openPalette(); return; }
  if (e.key === ' ' && S.play.tid && !e.target.closest('button,[role=button]')) { e.preventDefault(); ACT.playPause(); return; }
  if (e.key === 'Enter' && e.target.matches('[data-open]')) { openRef(e.target.dataset.open); return; }
  if (e.key === 'Enter' && e.target.matches('[data-act].inbox-item, [data-act].row')) { e.target.click(); return; }
  if ((e.key === 'Backspace' || e.key === 'Delete') && e.target.matches('[data-menu]')) { const [k, id] = e.target.dataset.menu.split(':'); if (k === 'release' && ownedRel(R(id))) dropRefs(R(id).tracks.map(t => t.id), `\u201c${R(id).title}\u201d`); if (k === 'track' && T(id).state === 'library') dropRefs([id], `\u201c${T(id).title}\u201d`); return; }
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && e.target.matches('[data-drag]')) { const [pid, tid] = e.target.dataset.drag.split(':'); const p = PL(pid), i = p.tracks.indexOf(tid), j = e.key === 'ArrowUp' ? i - 1 : i + 1; if (j >= 0 && j < p.tracks.length) { movePl(p, i, j); setTimeout(() => $(`[data-drag="${pid}:${tid}"]`)?.focus(), 10); } e.preventDefault(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { const s = e.target.closest('.popover, #menu'); if (s) { const b = $$('button', s); const i = b.indexOf(document.activeElement); const n = b[(i + (e.key === 'ArrowDown' ? 1 : -1) + b.length) % b.length]; n && n.focus(); e.preventDefault(); } }
});
/* drag & drop: reorder within a playlist, or drop items on a sidebar playlist */
let dragData = null;
document.addEventListener('dragstart', e => {
  const reorder = e.target.closest('[data-drag]'), ref = e.target.closest('[data-dragref]');
  if (reorder) { const [p, t] = reorder.dataset.drag.split(':'); dragData = {type: 'reorder', p, t, ref: 'track:' + t}; reorder.classList.add('dragging'); }
  else if (ref) dragData = {type: 'ref', ref: S.sel.on && S.sel.ids.has(ref.dataset.dragref.split(':')[1]) ? 'sel' : ref.dataset.dragref};
  else return;
  e.dataTransfer.effectAllowed = 'copyMove'; try { e.dataTransfer.setData('text/plain', dragData.ref); } catch (x) {}
});
document.addEventListener('dragend', () => { dragData = null; $$('.dragging,.drop-before,.drop-target').forEach(el => el.classList.remove('dragging', 'drop-before', 'drop-target')); });
document.addEventListener('dragover', e => {
  if (!dragData) return;
  const pl = e.target.closest('[data-drop-pl]'), row = e.target.closest('[data-drag]');
  $$('.drop-before,.drop-target').forEach(el => el.classList.remove('drop-before', 'drop-target'));
  if (pl) { e.preventDefault(); pl.classList.add('drop-target'); }
  else if (row && dragData.type === 'reorder' && row.dataset.drag.split(':')[0] === dragData.p) { e.preventDefault(); row.classList.add('drop-before'); }
});
document.addEventListener('drop', e => {
  if (!dragData) return;
  const pl = e.target.closest('[data-drop-pl]'), row = e.target.closest('[data-drag]');
  if (pl) { e.preventDefault(); addToPlaylist(pl.dataset.dropPl, dragData.ref); }
  else if (row && dragData.type === 'reorder') {
    e.preventDefault(); const [pid, tid] = row.dataset.drag.split(':'); const p = PL(pid);
    if (pid === dragData.p && tid !== dragData.t) { const from = p.tracks.indexOf(dragData.t); p.tracks.splice(from, 1); p.tracks.splice(p.tracks.indexOf(tid), 0, dragData.t); render(); }
  }
  dragData = null;
});
addEventListener('resize', () => { if (S.menu || S.pop) { S.menu = null; S.pop = null; renderOverlay(); } renderChrome(); });

/* ---------- boot ---------- */
(function boot() {
  const th = store('theme'); if (th && th !== 'system') document.documentElement.dataset.theme = th;
  const ts = store('ts'); if (ts) document.documentElement.style.setProperty('--ts', ts);
  if (store('skin') === 'mi') document.documentElement.dataset.skin = 'mi';
  renderToolbarOnce(); render();
  if (S.welcome) runWelcome();
})();
</script>
